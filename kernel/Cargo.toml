[package]
name = "paparaci"
version = "0.5.0"
edition = "2021"
description = "Paparaci microkernel of the Shizoley OS"
license = "Apache-2.0"

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory", "sse"] }
volatile = "0.2.6"
spin = "0.9.8"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package.metadata.bootimage]
run-args = ["-drive", "format=raw,file={iso}", "-serial", "stdio"]
