name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  kernel:
    name: kernel (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel

      - name: install bootimage
        run: cargo install bootimage

      - name: build boot image
        working-directory: kernel
        run: cargo bootimage

      - name: clippy
        working-directory: kernel
        run: cargo clippy -- -D warnings

      - name: fmt
        working-directory: kernel
        run: cargo fmt --check

      - name: smoke test in qemu
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          set +e
          timeout 120 qemu-system-x86_64 \
            -drive format=raw,file=kernel/target/x86_64-paparaci/debug/bootimage-paparaci.bin \
            -display none -serial stdio -no-reboot -no-shutdown \
            > serial.log 2>&1
          set -e
          cat serial.log
          grep -qF "[init] threads: 3 4" serial.log
          grep -qF "[t2] tick 2" serial.log
          grep -qF "[init] pong from 2" serial.log
          grep -qF "[fsd] served 'motd' (104 bytes) to 1" serial.log
          grep -qE "\[init\] rtc says: [0-9][0-9]:[0-9][0-9]:[0-9][0-9]" serial.log
          grep -qF "[eq] first event: 'e0' op 1 from 2" serial.log
          grep -qF "[eq] 100 events in" serial.log
          grep -qF "[init] drained 101 events, bye" serial.log
          grep -qF "[hello] wait denied (no WAIT right): per-op caps ok" serial.log
          grep -qF "[eq] zcopy: 8192 bytes via handle 1: pattern ok" serial.log
          grep -qF "[eq] zcopy: gift 1 consumed (2 pages freed)" serial.log
          grep -qF "[gdemo64] vmx unavailable (guest_create refused)" serial.log
          grep -qF "process 'init' (1) finished" serial.log
          grep -qF "[vmx]" serial.log
          grep -qF "[console] up: kernel sink attached" serial.log
          grep -qF "[gdemo] vmx unavailable (guest_create refused)" serial.log
          grep -qE "\[caps\] granted 0x1 on queue [0-9]+ to pid 2" serial.log
          grep -qF "[eq] wait: alerted (wait canceled)" serial.log
          grep -qE "\[eq\] queue [0-9]+ closed \(owner 1 gone\)" serial.log
          grep -qF "[hello] forged token denied: capabilities are unguessable" serial.log
          grep -qF "[capsdemo] all ok" serial.log
          grep -qF "[caps] would_cycle refused" serial.log
          grep -qF "[capsuser] post denied after revoke (cascade ok)" serial.log
          grep -qE "process 'init' \(1\) torn down, [0-9]+ frames freed" serial.log
          grep -qF "[timed] up: kernel timer sink attached" serial.log
          grep -qE "\[eq\] kernel event sink timer -> queue [0-9]+ owned by pid [0-9]+" serial.log
          grep -qF "[sleeper] slept 300ms (measured " serial.log
          grep -qF "[init] napped (measured " serial.log
          grep -qF "[timed] fired at tick " serial.log
          grep -qE "\[ps\] [0-9]+ run [0-9]+ timed" serial.log
          grep -qE "\[ps\] [0-9]+ run [0-9]+ sleeper" serial.log
          grep -qE "\[kill\] target [0-9]+ terminated \(by [0-9]+\)" serial.log
          grep -qF "[init] kill ok" serial.log

  userspace:
    name: userspace (c++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: build
        run: |
          cmake -S userspace -B userspace/build
          cmake --build userspace/build

      - name: cppcheck
        run: cppcheck --enable=warning --error-exitcode=1 --std=c++20 userspace/src userspace/programs
